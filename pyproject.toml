[project]
name = "chemcloud-server"
version = "0.15.2"
description = "An HTTP API for BigChem"
authors = [{ name = "Colton Hicks", email = "github@coltonhicks.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "bigchem==0.11.0",
    "cached-property>=2.0.1",
    "fastapi>=0.139.0",
    "gunicorn>=26.0.0",
    "httptools>=0.8.0",
    "httpx>=0.28.1",
    "logfire[fastapi]>=4.37.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "qccompute>=0.13.2",
    "qcdata>=0.18.0",
    "uvicorn>=0.51.0",
    "uvloop>=0.22.1",
]

[project.urls]
Homepage = "https://chemcloud.mtzlab.com"
Repository = "https://github.com/mtzgroup/chemcloud-server"

[dependency-groups]
dev = [
    "colorama>=0.4.6",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.21",
    "toml>=0.10.2",
    "types-requests>=2.33.0.20260712",
    "types-toml>=0.10.8.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chemcloud_server"]

[tool.pytest.ini_options]
testpaths = "tests/"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
isort = { known-first-party = ["tests"] }
select = ["I", "F401"]

[tool.ruff.lint.per-file-ignores]
"chemcloud_server/routes/dashboard.py" = ["E501"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*site-packages*", "*__init__.py"]

[tool.mypy]
plugins = "pydantic.mypy"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
